version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Guatemala
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Guatemala
    commit-message:
      prefix: build
    labels: [dependencies]
    groups:
      dev-tools:
        dependency-type: development
