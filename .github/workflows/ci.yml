name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Lunes 06:00 en Guatemala: detecta vulnerabilidades nuevas sin cambios de código.
    - cron: "0 12 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Calidad de código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync

      - name: Ejecutar verificaciones de pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Exportar dependencias fijadas con hashes
        run: >-
          uv export --frozen --all-groups --no-emit-project
          --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"

      - name: Buscar vulnerabilidades conocidas
        run: >-
          uvx --python 3.12 pip-audit@2.9.0
          -r "$RUNNER_TEMP/requirements.txt"
          --strict --disable-pip --require-hashes --progress-spinner off

  tests:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv y Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Instalar dependencias
        run: uv sync

      - name: Ejecutar pruebas con cobertura
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pruebas-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 30

  e2e:
    name: Pruebas e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync

      - name: Instalar Chromium para Playwright
        run: uv run playwright install --with-deps chromium

      - name: Ejecutar pruebas e2e del mapa de la ruta 801
        run: >-
          uv run pytest prototype/routing -m e2e
          --screenshot only-on-failure --output test-results

      - name: Publicar capturas de las fallas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pruebas-e2e
          path: test-results
          retention-days: 14

  commits:
    name: Mensajes de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync

      - name: Validar Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          check() {
            printf '%s\n' "$1" > "$RUNNER_TEMP/commit-msg"
            uv run pre-commit run conventional-pre-commit \
              --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/commit-msg"
          }
          echo "Título del pull request: $PR_TITLE"
          check "$PR_TITLE"
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            echo "Commit $sha"
            check "$(git log -1 --format=%B "$sha")"
          done
