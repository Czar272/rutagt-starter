[project]
name = "rutagt"
version = "0.1.0"
description = "Planificador multimodal de transporte público para el Área Metropolitana de Guatemala."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["data", "work"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errores
  "W",    # pycodestyle advertencias
  "F",    # pyflakes
  "I",    # orden de imports
  "N",    # convenciones de nombres
  "UP",   # sintaxis moderna de Python
  "B",    # errores probables
  "C4",   # comprensiones
  "SIM",  # simplificaciones
  "PTH",  # uso de pathlib
  "S",    # seguridad (bandit)
  "RUF",  # reglas propias de Ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["pipeline", "tests"]
exclude = ["^data/", "^work/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
