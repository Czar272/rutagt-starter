# Configuración de Alembic para el esquema canónico de RutaGT (ADR-0030).
# La conexión no se define aquí: se lee de las variables RUTAGT_DB_*.
#   uv run --env-file .env alembic upgrade head

[alembic]
script_location = %(here)s/database/migrations
file_template = r%%(rev)s_%%(slug)s
path_separator = os
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
